<!DOCTYPE html>
<html lang="sl" data-dvig="bench">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balkan Rank</title>
<meta name="description" content="Vpiši svoj maksimalni dvig in telesno težo. Dobiš svoj rang in kartico za objavo.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0a0a'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23f2c200' stroke-width='5'/></svg>">

<meta property="og:title" content="Balkan Rank">
<meta property="og:description" content="Kakšen je tvoj rang? Dve številki, pet sekund.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css?v=18">
</head>
<body>

<header class="glava" id="glava">
  <div class="glava-vsebina">
    <div class="znamka">
      <picture class="znak">
        <source srcset="slike/znak.webp" type="image/webp">
        <img src="slike/znak.png" alt="" width="96" height="96">
      </picture>
      BALKAN<span>RANK</span>
    </div>
    <!-- gumbi se izrišejo iz BR_SEZNAM_JEZIKOV -->
    <nav class="jezik" id="jezik-izbira" aria-label="Jezik / Jezik / Language"></nav>
    <button type="button" class="glava-cta" id="glava-cta" data-t="g_cta"></button>
  </div>
</header>

<main>

  <!-- naslov in obrazec na fotografiji telovadnice -->
  <section class="vrh">
    <picture class="vrh-slika" aria-hidden="true">
      <source srcset="slike/gym-bench.webp" type="image/webp">
      <img src="slike/gym-bench.jpg" alt="">
    </picture>
    <div class="vrh-tanca" aria-hidden="true"></div>

    <div class="vrh-vsebina">

    <div class="pristanek">
      <h1 data-t="naslov"></h1>
      <p class="podnapis" data-t="podnapis"></p>
    </div>

    <!-- kartice se rišejo v canvas, da so v izbranem jeziku -->
    <div class="kup" id="kup" aria-hidden="true">
      <div class="kup-mesto kup-levo"><div class="kup-lebdi"><canvas width="720" height="900"></canvas></div></div>
      <div class="kup-mesto kup-sredina"><div class="kup-lebdi"><canvas width="720" height="900"></canvas></div></div>
      <div class="kup-mesto kup-desno"><div class="kup-lebdi"><canvas width="720" height="900"></canvas></div></div>
    </div>

  <form id="obrazec" class="obrazec plosca-steklo" novalidate>

    <!-- izbira dviga: barve tekmovalnih plošč -->
    <fieldset class="dvigi">
      <legend class="sr-only" data-t="dvig"></legend>
      <label class="ploscica">
        <input type="radio" name="dvig" value="bench" checked>
        <span><i class="pika" aria-hidden="true"></i><em data-t="dvig_bench"></em></span>
      </label>
      <label class="ploscica">
        <input type="radio" name="dvig" value="pocep">
        <span><i class="pika" aria-hidden="true"></i><em data-t="dvig_pocep"></em></span>
      </label>
      <label class="ploscica">
        <input type="radio" name="dvig" value="mrtvi">
        <span><i class="pika" aria-hidden="true"></i><em data-t="dvig_mrtvi"></em></span>
      </label>
      <label class="ploscica">
        <input type="radio" name="dvig" value="zgibi">
        <span><i class="pika" aria-hidden="true"></i><em data-t="dvig_zgibi"></em></span>
      </label>
    </fieldset>

    <!-- glavno polje: številka na utežni plošči -->
    <div class="plosca" id="plosca">

      <svg class="utez" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
        <defs>
          <filter id="u-senca" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur stdDeviation="12"/>
          </filter>
          <linearGradient id="u-odsev" x1="0.08" y1="0" x2="0.72" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0.30"/>
            <stop offset="0.34" stop-color="#fff" stop-opacity="0.07"/>
            <stop offset="0.62" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
          </linearGradient>
          <mask id="u-obroc">
            <circle cx="160" cy="160" r="150" fill="#fff"/>
            <circle cx="160" cy="160" r="50" fill="#000"/>
          </mask>
        </defs>

        <circle cx="160" cy="182" r="148" fill="#000" opacity="0.9" filter="url(#u-senca)"/>

        <g mask="url(#u-obroc)">
          <circle class="u-telo" cx="160" cy="160" r="150"/>
          <g class="u-vrti">
            <circle cx="160" cy="160" r="112" fill="none" stroke="#000" stroke-opacity="0.38" stroke-width="2"/>
            <circle cx="160" cy="160" r="76" fill="none" stroke="#000" stroke-opacity="0.26" stroke-width="2"/>
            <circle cx="254" cy="160" r="13" fill="#000" fill-opacity="0.45"/>
            <circle cx="207" cy="241" r="13" fill="#000" fill-opacity="0.45"/>
            <circle cx="113" cy="241" r="13" fill="#000" fill-opacity="0.45"/>
            <circle cx="66"  cy="160" r="13" fill="#000" fill-opacity="0.45"/>
            <circle cx="113" cy="79"  r="13" fill="#000" fill-opacity="0.45"/>
            <circle cx="207" cy="79"  r="13" fill="#000" fill-opacity="0.45"/>
          </g>
          <circle cx="160" cy="160" r="150" fill="url(#u-odsev)"/>
        </g>

        <circle class="u-rob" cx="160" cy="160" r="149" fill="none"/>
        <circle class="u-rob" cx="160" cy="160" r="50" fill="none"/>
      </svg>

      <label for="kolicina" class="plosca-oznaka" id="oznaka-kolicina" data-t="kolicina_kg"></label>
      <div class="plosca-vrstica">
        <input type="number" id="kolicina" name="kolicina" inputmode="decimal"
               min="1" max="500" step="0.5" placeholder="0" autocomplete="off" required>
        <span class="plosca-enota" id="enota-kolicina" data-t="enota_kg"></span>
      </div>
    </div>

    <!-- tiho okoli: oznaka levo, vnos desno -->
    <div class="vrstice">

      <div class="vrstica">
        <label for="teza" data-t="teza"></label>
        <div class="desno">
          <span class="polje-okvir">
            <input type="number" id="teza" name="teza" inputmode="decimal"
                   min="30" max="250" step="0.5" data-t-namig="namig_teza" autocomplete="off" required>
            <span class="enota" data-t="enota_kg"></span>
          </span>
        </div>
      </div>

      <div class="vrstica">
        <span class="oznaka" id="oznaka-spol" data-t="spol"></span>
        <div class="desno" role="radiogroup" aria-labelledby="oznaka-spol">
          <label class="preklop">
            <input type="radio" name="spol" value="m" checked>
            <span data-t="spol_m"></span>
          </label>
          <label class="preklop">
            <input type="radio" name="spol" value="z">
            <span data-t="spol_z"></span>
          </label>
        </div>
      </div>

      <div class="vrstica">
        <label for="trajanje" data-t="trajanje"></label>
        <div class="desno">
          <span class="polje-okvir">
            <select id="trajanje" name="trajanje">
              <option value="pod6m" data-t="trajanje_pod6m"></option>
              <option value="6-12m" data-t="trajanje_6_12m"></option>
              <option value="1-3l" selected data-t="trajanje_1_3l"></option>
              <option value="3-5l" data-t="trajanje_3_5l"></option>
              <option value="nad5l" data-t="trajanje_nad5l"></option>
            </select>
          </span>
        </div>
      </div>

    </div>

    <p class="napaka" id="napaka" role="alert" hidden></p>

    <button type="submit" class="glavni-gumb" data-t="izracunaj"></button>
  </form>

    </div>
  </section>

  <section id="rezultat" class="rezultat" hidden aria-live="polite"></section>

  <!-- lestvica mej -->
  <section class="razdelek razkrij" id="lestvica">
    <h2 data-t="l_naslov"></h2>
    <p class="razdelek-opis">
      <span data-t="l_opis"></span>
      <span class="lestvica-spol" id="lestvica-spol"></span>
    </p>
    <div class="tabela-ovoj">
      <table class="lestvica-tabela" id="lestvica-tabela"></table>
    </div>
    <p class="razdelek-opomba" id="lestvica-opomba"></p>
  </section>

  <!-- pogosta vprašanja -->
  <section class="razdelek razkrij" id="vprasanja">
    <h2 data-t="v_naslov"></h2>
    <details class="vprasanje">
      <summary data-t="v1_q"></summary>
      <p data-t="v1_a"></p>
    </details>
    <details class="vprasanje">
      <summary data-t="v2_q"></summary>
      <p data-t="v2_a"></p>
    </details>
    <details class="vprasanje">
      <summary data-t="v3_q"></summary>
      <p data-t="v3_a"></p>
    </details>
  </section>

</main>

<footer class="noga">
  <p data-t="opozorilo"></p>
  <p data-t="primerjava"></p>
  <p class="noga-znamka">BALKAN RANK</p>
</footer>

<script src="config.js?v=18"></script>
<script src="jeziki.js?v=18"></script>
<script src="baza.js?v=18"></script>
<script src="izracun.js?v=18"></script>
<script src="logo.js?v=18"></script>
<script src="kartica.js?v=18"></script>
<script src="app.js?v=18"></script>
</body>
</html>
